chair:
    name: Stefano Fochesatto
    photo: assets/img/officers/anon.jpg
    bio: Stefano is a second-year PhD student from Fairbanks, Alaska, with bachelor's and master's degrees in Mathematics from the University of Alaska Fairbanks. Research interests are in numerics and scientific computing, including constrained differential equations, variational inequalities, and multiphysics problems like fluid-structure interaction. Outside the department, Stefano can be found long-distance running, playing music, or out on science fieldwork.

vice_chair:
    name: Maria Valentini
    photo: assets/img/officers/anon.jpg
    bio: Maria is a fifth-year PhD student in the Computer Science and Cognitive Science dual degree program. Research focuses on Natural Language Processing, using computational models to understand and enhance early childhood word learning. Originally from northern Minnesota, Maria studied mathematics and computer information systems at the College of St. Scholastica while competing on the collegiate tennis team, and now enjoys music, hockey, and caring for two guinea pigs.

vice_chair2:
    name: Lucas White
    photo: assets/img/officers/anon.jpg
    bio: Lucas is a second-year PhD student in Computer Science advised by Alvaro Velasquez. Research interests are in molecular generation and constrained diffusion, at the intersection of machine learning and scientific discovery.

treasurer:
    name: Adarsh Ashokan
    photo: assets/img/officers/anon.jpg
    bio: Adarsh is a master's student in Computer Science with research interests in distributed systems, operating systems, storage infrastructure, and high-performance software. Before CU Boulder, Adarsh completed an undergraduate degree at NIT Trichy and worked as a software engineer at Oracle, and has contributed to open-source systems projects through Ceph. Outside of work, Adarsh enjoys quizzing, YouTube, and following Manchester United.

gpdc_chair:
    name: Siddharth De
    contact: siddharth.de@
    photo: assets/img/officers/siddharth.jpeg
    pronouns: He/Him/His
    bio: Siddharth is a 2nd year MS-CSEN student. His research interests lie in Computer Vision and Robotics. In his free time, he enjoys doing puzzles especially the daily NYT games.

gpdc_vice_chair:
    name: Saksham Khatwani
    contact: saksham.khatwani@
    photo: assets/img/officers/saksham_khatwani.jpeg
    pronouns: He/Him/His
    bio: Saksham is a research student passionate about contributing to the department and fostering professional growth alongside peers. He works on various NLP research projects, including those focused on low-resource languages and semantic text representations. Outside of academics, he enjoys cooking, often with a food documentary playing in the background.

gpdc_treasurer:
    name: Ankur Varma
    contact: ankur.varma@
    photo: assets/img/officers/ankur_varma.jpg
    pronouns: He/Him/His
    bio: Ankur Varma is a second year CSEN-MS student who is excited about studying reachablity analysis for Cyber Physical systems. In his free time he likes doing calisthenics workouts.

grad_comm:
    - name: Neelima Prasad
      contact: neelima.prasad@
      photo: assets/img/officers/Neelima_Prasad.jpeg
      pronouns: She/Her/Hers
      bio: Neelima is a 3rd year PhD student currently studying computer vision and deep learning. She loves dancing, cooking and exploring new cities. She can often be found in the forest photographing birds.

    - name: Chandana Sunkara
      contact:  chandana.sunkara@
      pronouns: She/Her/Hers
      photo: assets/img/officers/chandana_sunkara.jpg
      bio:  Chandana is a Master’s student in Computer Science. She is excited about using technology to build thoughtful, user-centred solutions and looking forward to collaborating with peers to make our grad community more connected, inclusive, and inspiring. 

tea_time:
    - name: Nicholas Lewchenko
      contact: Nicholas.Lewchenko@
      pronouns: He/Him/His
      photo: assets/img/officers/nicholas.jpeg
      bio: Nicholas is a PhD student in Computer Science at the University of Colorado Boulder, advised by Professor Gowtham Kaki and formerly by Professor Pavol Černý. His research focuses on the intersection of programming languages and distributed systems, with an emphasis on identifying programming model restrictions that make distributed programs easier to write, verify, and reason about.

exec_comm:
    name: Breane Crockett
    contact: Breane.Crocketth@
    pronouns: She/Her/Hers
    photo: assets/img/officers/breanne_crockett.JPG
    bio: Breanne is a PhD student working on human-robot interaction in the Collaborative AI and Robotics lab. In her free time, she enjoys knitting, hiking and playing trumpet in local Boulder bands.

